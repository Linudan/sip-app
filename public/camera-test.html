<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест камеры</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div id="qr-reader" style="width: 500px; margin: 0 auto;"></div>
    <div id="result"></div>
    <script>
        const html5QrCode = new Html5Qrcode("qr-reader");
        const qrCodeSuccessCallback = (decodedText) => {
            document.getElementById('result').innerHTML = `<b>Отсканировано:</b> ${decodedText}`;
            html5QrCode.stop();
        };
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, qrCodeSuccessCallback);
    </script>
</body>
</html>
